name: Daily Opportunity Scan

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: opportunity-radar
  cancel-in-progress: false

env:
  RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run deterministic scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scan.py
      - name: Run optional semantic business analysis
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scripts/llm_analyze.py
      - name: Build dashboard
        run: python scripts/build_dashboard.py
      - name: Run tests
        run: python -m pytest -q
      - name: Commit generated data and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports dashboard
          git diff --cached --quiet || git commit -m 'chore: update opportunity radar'
          git push
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-rubika:
    name: Notify Rubika
    needs: deploy
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send scan report to Rubika bot chat
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          REPORT_URL: https://mydsoftware.github.io/open-source-opportunity-radar/
        run: |
          set -euo pipefail
          if [ -z "${RUBIKA_BOT_TOKEN:-}" ]; then
            echo 'RUBIKA_BOT_TOKEN secret is not configured; notification skipped.'
            exit 0
          fi
          updates=$(curl -fsS -X POST "https://botapi.rubika.ir/v3/${RUBIKA_BOT_TOKEN}/getUpdates" \
            -H 'Content-Type: application/json' \
            --data '{"limit":20}')
          chat_id=$(printf '%s' "$updates" | jq -r '[ .data?.updates[]? | .chat_id? ] | map(select(type == "string" and length > 0)) | last // empty')
          if [ -z "$chat_id" ]; then
            echo 'No Rubika chat_id found. Send /start to githubscanbot, then rerun this workflow.'
            exit 1
          fi
          text="🚨 رادار فرصت‌های متن‌باز\n\nاسکن جدید با موفقیت انجام شد ✅\n\n📊 داشبورد و گزارش کامل:\n${REPORT_URL}\n\n⏰ این گزارش توسط Open Source Opportunity Radar تولید شده است."
          curl -fsS -X POST "https://botapi.rubika.ir/v3/${RUBIKA_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg chat_id "$chat_id" --arg text "$text" '{chat_id:$chat_id,text:$text}')"
